spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10

  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_HOST}:${NACOS_PORT:8848}

ai:
  gateway:
    router:
      default-provider: ${AI_DEFAULT_PROVIDER:aliyun}
      providers:
        - name: aliyun
          type: qwen
          endpoint: https://dashscope.aliyuncs.com/api/v1
          api-key: ${DASHSCOPE_API_KEY}
          models:
            - name: qwen-turbo
              enabled: true
              max-tokens: 8000
              temperature: 0.7
            - name: qwen-plus
              enabled: true
              max-tokens: 32000
              temperature: 0.7
        - name: zhipu
          type: glm
          endpoint: https://open.bigmodel.cn/api/paas/v4
          api-key: ${ZHIPU_API_KEY}
          models:
            - name: glm-4
              enabled: true
              max-tokens: 128000
              temperature: 0.7

    rate-limit:
      enabled: true
      default-qps: 10
      default-daily-limit: 1000

    circuit-breaker:
      enabled: true
      failure-rate-threshold: 50
      wait-duration-in-open-state: 60000
      sliding-window-size: 10

    billing:
      enabled: true
      track-per-user: true

    content-filter:
      enabled: true
      block-list:
        - 政治敏感词
        - 违法词汇
      replace-char: '*'

  voice:
    asr:
      endpoint: ${ASR_ENDPOINT}
      app-key: ${ASR_APP_KEY}
    tts:
      endpoint: ${TTS_ENDPOINT}
      app-key: ${TTS_APP_KEY}

logging:
  level:
    root: WARN
    com.interviewai: INFO
    com.interviewai.aigateway: INFO
