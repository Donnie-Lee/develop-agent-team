server:
  port: 8087

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848

ai:
  gateway:
    router:
      default-provider: aliyun
      providers:
        - name: aliyun
          type: qwen
          endpoint: https://dashscope.aliyuncs.com/api/v1
          api-key:
          models:
            - name: qwen-turbo
              enabled: true
              max-tokens: 8000
              temperature: 0.7
            - name: qwen-plus
              enabled: true
              max-tokens: 32000
              temperature: 0.7
        - name: zhipu
          type: glm
          endpoint: https://open.bigmodel.cn/api/paas/v4
          api-key:
          models:
            - name: glm-4
              enabled: true
              max-tokens: 128000
              temperature: 0.7

    rate-limit:
      enabled: false
      default-qps: 10
      default-daily-limit: 1000

    circuit-breaker:
      enabled: false
      failure-rate-threshold: 50
      wait-duration-in-open-state: 60000
      sliding-window-size: 10

    billing:
      enabled: false
      track-per-user: true

    content-filter:
      enabled: false
      block-list:
        - 政治敏感词
        - 违法词汇
      replace-char: '*'

  voice:
    asr:
      endpoint:
      app-key:
    tts:
      endpoint:
      app-key:

logging:
  level:
    com.interviewai: DEBUG
    com.interviewai.aigateway: DEBUG
