version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: interview-postgres
    environment:
      POSTGRES_DB: interview_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: interview-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nacos 服务发现
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: interview-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: host.docker.internal
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      JVM_XMS: 512m
      JVM_MMS: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8848/nacos || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: interview-rocketmq-namesrv
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    ports:
      - "9876:9876"
    volumes:
      - rocketmq_namesrv:/home/rocketmq/namesrv/logs
    command: ["sh", "mqnamesrv"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9876 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: interview-rocketmq-broker
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - rocketmq_broker:/home/rocketmq/broker/logs
      - rocketmq_store:/home/rocketmq/store
    depends_on:
      - rocketmq-namesrv
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876"]

  # RocketMQ Dashboard (可选)
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: interview-rocketmq-dashboard
    environment:
      JAVA_OPTS: "-Xms256m -Xmx256m"
      ROCKETMQ_CONFIG_NAMESRVADDR: rocketmq-namesrv:9876
    ports:
      - "8088:8080"
    depends_on:
      - rocketmq-namesrv

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: interview-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  nacos_data:
  rocketmq_namesrv:
  rocketmq_broker:
  rocketmq_store:
  es_data:
