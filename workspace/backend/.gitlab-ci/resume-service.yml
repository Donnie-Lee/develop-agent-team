# resume-service CI/CD配置

resume-service-build:
  extends: .docker-base
  stage: build
  script:
    - cd resume-service
    - mvn clean package -DskipTests
    - docker build -t ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/resume-service:${CI_COMMIT_SHA} .
    - docker push ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/resume-service:${CI_COMMIT_SHA}
  artifacts:
    paths:
      - resume-service/target/*.jar
    expire_in: 1 day
  only:
    - develop
    - main
    - tags

resume-service-test:
  extends: .docker-base
  stage: test
  script:
    - cd resume-service
    - mvn test -Dspring.profiles.active=test
  coverage: '/Total.*?([0-9]{1,3})%/'
  only:
    - develop
    - merge_requests