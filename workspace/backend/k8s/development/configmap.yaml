# interview-ai 公共配置 (开发环境)
apiVersion: v1
kind: ConfigMap
metadata:
  name: interview-ai-config
  namespace: interview-ai-dev
data:
  db.host: "postgresql.database.svc.cluster.local"
  db.port: "5432"
  redis.host: "redis.cache.svc.cluster.local"
  redis.port: "6379"
  nacos.host: "nacos.registry.svc.cluster.local"
---
# 数据库配置
apiVersion: v1
kind: Secret
metadata:
  name: interview-ai-secrets
  namespace: interview-ai-dev
type: Opaque
stringData:
  db.username: "postgres"
  db.password: "postgres-dev-password"
  redis.password: ""
  jwt.secret: "your-256-bit-secret-key-change-in-production"
  aliyun.access-key-id: ""
  aliyun.access-key-secret: ""