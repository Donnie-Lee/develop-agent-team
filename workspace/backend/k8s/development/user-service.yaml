# user-service K8s配置 (开发环境)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: interview-ai-dev
  labels:
    app: user-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        version: v1
    spec:
      containers:
        - name: user-service
          image: registry.example.com/interview-ai/user-service:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: interview-ai-config
                  key: db.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: interview-ai-config
                  key: db.port
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: interview-ai-config
                  key: redis.host
            - name: NACOS_HOST
              valueFrom:
                configMapKeyRef:
                  name: interview-ai-config
                  key: nacos.host
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: interview-ai-dev
spec:
  selector:
    app: user-service
  ports:
    - port: 80
      targetPort: 8081
      name: http
  type: ClusterIP