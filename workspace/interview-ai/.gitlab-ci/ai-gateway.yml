# ai-gateway CI/CD配置

ai-gateway-build:
  extends: .docker-base
  stage: build
  script:
    - cd ai-gateway
    - mvn clean package -DskipTests
    - docker build -t ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/ai-gateway:${CI_COMMIT_SHA} .
    - docker push ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/ai-gateway:${CI_COMMIT_SHA}
  artifacts:
    paths:
      - ai-gateway/target/*.jar
    expire_in: 1 day
  only:
    - develop
    - main
    - tags

ai-gateway-test:
  extends: .docker-base
  stage: test
  script:
    - cd ai-gateway
    - mvn test -Dspring.profiles.active=test
  coverage: '/Total.*?([0-9]{1,3})%/'
  only:
    - develop
    - merge_requests