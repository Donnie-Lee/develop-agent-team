# GitLab CI/CD 公共配置
# AI面试练习平台 - CI配置

variables:
  DOCKER_REGISTRY: registry.example.com
  DOCKER_IMAGE_PREFIX: interview-ai
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

# Maven缓存
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository
    - target/

# Docker构建配置
.docker-base:
  image: maven:3.9-eclipse-temurin-17
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $DOCKER_REGISTRY || true

# 代码检查
.code-check:
  script:
    - mvn clean compile -DskipTests
    - mvn checkstyle:check -Dcheckstyle.config.location=checkstyle.xml || true
    - mvn pmd:pmd -Dpmd.config.location=pmd-ruleset.xml || true

# 单元测试
.unit-test:
  script:
    - mvn test -Dspring.profiles.active=test
  coverage: '/Total.*?([0-9]{1,3})%/'

# 打包
.package:
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - "*/target/*.jar"
    expire_in: 1 day

# Docker镜像构建
.docker-build:
  script:
    - |
      SERVICE_NAME=${CI_PROJECT_NAME}
      VERSION=${CI_COMMIT_TAG:-latest}
      docker build -t ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/${SERVICE_NAME}:${VERSION} -f ${SERVICE_NAME}/Dockerfile ${SERVICE_NAME}
    - docker push ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/${SERVICE_NAME}:${VERSION}
  only:
    - tags
    - main
    - develop