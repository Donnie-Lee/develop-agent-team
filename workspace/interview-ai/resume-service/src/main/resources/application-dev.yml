server:
  port: 8082

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/interview_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: postgres
    password: postgres
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms

  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt

aliyun:
  oss:
    endpoint: oss-cn-shanghai.aliyuncs.com
    access-key-id:
    access-key-secret:
    bucket-name: interview-ai-resume
    domain: https://interview-ai-resume.oss-cn-shanghai.aliyuncs.com

jwt:
  secret: dev-secret-key-change-in-production-12345678
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

logging:
  level:
    com.interviewai: DEBUG
