server:
  port: 8083

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/interview_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: postgres
    password: postgres
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848

  rocketmq:
    namesrv-addr: localhost:9876
    producer:
      group: interview-producer-group

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: now()
      logic-not-delete-value: null

websocket:
  path: /ws/interview
  max-text-buffer-size: 10485760
  max-binary-buffer-size: 10485760

jwt:
  secret: dev-secret-key-change-in-production-12345678
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

logging:
  level:
    com.interviewai: DEBUG
    org.springframework.web: INFO
